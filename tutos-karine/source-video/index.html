<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Nunito;font-weight:400;src:url(a/nunito-latin-400-normal.woff2)}
@font-face{font-family:Nunito;font-weight:700;src:url(a/nunito-latin-700-normal.woff2)}
@font-face{font-family:Nunito;font-weight:800;src:url(a/nunito-latin-800-normal.woff2)}
@font-face{font-family:Nunito;font-weight:900;src:url(a/nunito-latin-900-normal.woff2)}
@font-face{font-family:Dancing;font-weight:700;src:url(a/dancing-script-700.woff2)}
@font-face{font-family:Allura;src:url(a/allura-latin-400-normal.woff2)}
:root{--rose:#e0527a;--bord:#7a1f3d;--cream:#fff6f4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Nunito,sans-serif;color:var(--bord)}
.bg{position:absolute;inset:-40px;background:url(a/fond.png) center/cover;opacity:.9}
.abs{position:absolute}
.scene{position:absolute;inset:0;opacity:0}
.center{left:0;width:1080px;text-align:center}
.h2{font-weight:800;font-size:54px;line-height:1.1}
.script{font-family:Dancing;font-weight:700;color:var(--rose)}
.pill{display:inline-block;background:var(--rose);color:#fff;font-weight:900;border-radius:999px;box-shadow:0 14px 34px rgba(224,82,122,.35)}
.phone{position:absolute;left:265px;top:290px;width:550px;height:1272px;border-radius:72px;background:#1d1a1c;padding:18px;box-shadow:0 40px 90px rgba(122,31,61,.35),0 0 0 3px #3b3438 inset}
.screen{position:relative;width:514px;height:1226px;border-radius:56px;overflow:hidden;background:#fff}
.zoom{position:absolute;left:0;top:0;width:514px;height:1226px;transform-origin:0 0}
.zoom img{width:514px;height:1226px;display:block}
.tap{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:8px solid var(--rose);background:rgba(224,82,122,.22);opacity:0}
.chap{position:absolute;left:0;right:0;margin:auto;width:max-content;opacity:0}
.num{display:inline-grid;place-items:center;width:66px;height:66px;border-radius:50%;background:var(--rose);color:#fff;font-weight:900;font-size:42px;vertical-align:middle;margin-right:16px;box-shadow:0 10px 26px rgba(224,82,122,.35)}
/* bulle posée sur l'image, flèche vers le bouton */
.bub{position:absolute;width:720px;opacity:0;z-index:20}
.bub .in{background:#fff;border-radius:36px;border:5px solid var(--rose);box-shadow:0 22px 60px rgba(122,31,61,.35);display:flex;align-items:center;gap:22px;padding:24px 32px 24px 22px}
.bub img{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:50% 12%;flex:none;border:4px solid #fde3e8;background:#fde3e8}
.bub .tx{font-weight:800;font-size:46px;line-height:1.2;color:var(--bord)}
.bub .tx b{color:var(--rose)}
.bub .ar{position:absolute;width:44px;height:44px;background:#fff;border:5px solid var(--rose);transform:rotate(45deg);margin-left:-22px}
.bub.up .ar{bottom:-22px;border-top:none;border-left:none}
.bub.down .ar{top:-22px;border-bottom:none;border-right:none}
.pause{position:absolute;right:28px;top:28px;background:rgba(122,31,61,.78);color:#fff;font-weight:900;font-size:26px;border-radius:999px;padding:8px 18px;opacity:0;z-index:6}
</style></head>
<body>
<div class="bg" id="bg"></div>
<div id="root"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function pop(el,t,a,dur=.45,dy=50){const p=lin(t,a,a+dur);el.style.opacity=p;el.style.transform=`translateY(${(1-eo(p))*dy}px)`}

// Vidéo source 540 × 1288, 30 i/s. Coordonnées (taps, bulles, zooms) en pixels de la vidéo source.
const SW=540,SH=1288,SCR_W=514,SCR_H=1226,K=SCR_W/SW,FPS=30,ORX=265+18,ORY=290+18;
const CH=['Choisis ta recette','Ajoute-la à ton panier','Tes courses','En cuisine','Ajoute-la à tes repas'];
const CARD=[['Sélectionne','ta recette','a/i1.png',640],['Ajoute ta recette','à ton panier','a/i2.png',600],
  ["Utilise l'application","quand tu fais tes courses",'a/i3.png',720],['Lorsque tu cuisines,',"utilise l'application",'a/i4.jpg',640],
  ['Ajoute la recette','à tes repas','a/i5.png',780]];
// Chaque ligne : hold (image figée à l'instant source) avec une bulle `t` pointant `at` (ou le tap), ou play (lecture sans texte).
const G=[
 {ch:0,hold:1.0,t:"Depuis l'accueil, appuie sur <b>« Recettes »</b>.",tap:[400,580],zoom:[400,560,1.25]},
 {ch:0,hold:7.3,t:"Tu peux <b>rechercher une recette</b> ici…",tap:[270,221],zoom:[270,320,1.25]},
 {ch:0,hold:7.35,t:"… ou <b>naviguer dans les recettes de Karine</b>.",at:[270,700],noptr:1},
 {ch:0,play:[7.3,13.5],v:1.2},
 {ch:0,hold:13.6,t:"Choisis une recette et appuie sur <b>« Découvrir la recette »</b>.",tap:[262,950],zoom:[262,900,1.25]},
 {ch:0,hold:17.5,t:"Voici la <b>fiche recette</b> : photo, ingrédients, préparation…",at:[270,640],noptr:1},
 {ch:1,hold:17.55,t:"Navigue vers le bas pour retrouver tous les boutons <b>« + Ajouter »</b>.",at:[270,1000],noptr:1},
 {ch:1,play:[17.5,23.5],v:1.2},
 {ch:1,hold:23.6,t:"Appuie sur <b>« + Mes courses »</b>.",tap:[271,634],zoom:[271,640,1.35]},
 {ch:1,hold:26.5,t:"Choisis <b>pour combien de personnes</b> tu cuisines : les quantités s'adaptent.",tap:[357,1075],zoom:[270,1000,1.2]},
 {ch:1,play:[26.5,29.3],v:1},
 {ch:1,hold:29.3,t:"Puis appuie sur <b>« Confirmer »</b>.",tap:[269,1168],zoom:[270,1080,1.2]},
 {ch:1,hold:32.0,t:"C'est ajouté ✓ Tu peux ajouter <b>plusieurs recettes</b> : les ingrédients <b>se cumulent</b> dans ton panier.",at:[270,589],zoom:[270,600,1.3]},
 {ch:2,hold:35.0,t:"Au magasin, appuie sur le <b>Panier</b>, en bas de l'écran.",tap:[433,1234],zoom:[400,1150,1.3]},
 {ch:2,hold:38.0,t:"Tous les ingrédients de tes recettes sont <b>rangés par rayon</b>.",at:[150,524]},
 {ch:2,hold:38.05,t:"<b>Coche</b> ce que tu achètes, ou ce que tu as <b>déjà à la maison</b> ✓",at:[55,558],zoom:[200,650,1.25]},
 {ch:2,play:[38.0,46.0],v:1.2,zoom:[200,650,1.25]},
 {ch:2,hold:46.0,d:1.6,zoom:[200,650,1.25]},
 {ch:3,hold:47.0,t:"Retourne sur la recette : <b>ingrédients, ustensiles et étapes</b> sont détaillés.",at:[270,700],noptr:1},
 {ch:3,play:[47.0,56.0],v:1.6},
 {ch:3,hold:56.0,t:"Tu peux aussi <b>agrandir les étapes</b> avec ce bouton, et <b>cocher celles que tu as terminées</b>.",tap:[271,408],zoom:[271,500,1.25]},
 {ch:4,hold:60.0,t:"Une fois ton plat cuisiné, remonte jusqu'aux boutons…",at:[270,700],noptr:1},
 {ch:4,play:[60.0,63.0],v:1},
 {ch:4,hold:63.0,t:"… et appuie sur <b>« + Mes repas »</b>.",tap:[413,780],zoom:[380,760,1.3]},
 {ch:4,hold:65.3,t:"Choisis le <b>moment de la journée</b> : ici, le dîner.",tap:[387,1088],zoom:[330,1000,1.25]},
 {ch:4,hold:66.4,t:"Et appuie sur <b>« Ajouter à mon dîner »</b>.",tap:[270,1218],zoom:[270,1080,1.2]},
 {ch:4,hold:82.0,t:"C'est enregistré 🎉 Ta recette est dans <b>tes repas</b>, avec les calories de ta journée.",at:[280,1050],zoom:[270,950,1.2]},
];
// Durée de lecture : on laisse le temps de lire, même lentement
const ZIN=.7,BUB_AT=.8;
G.forEach(g=>{
  if(g.play){g.dur=(g.play[1]-g.play[0])/g.v;return;}
  if(g.d){g.dur=g.d;return;}
  const n=g.t.replace(/<[^>]+>/g,'').length;
  g.dur=BUB_AT+Math.max(2.6,n/14)+.6;
});
const INTRO=3.0,GUIDE=4.8,CARD_D=3.0,OUTRO=4.2;
for(let k=CH.length-1;k>=0;k--){const j=G.findIndex(g=>g.ch===k);const nx=G[j];G.splice(j,0,{ch:k,card:k,dur:CARD_D,hold:nx.hold!==undefined?nx.hold:nx.play[0]});}
let T=INTRO+GUIDE;G.forEach(g=>{g.a=T;T+=g.dur;});
const END=T;window.DURATION=END+OUTRO;

$('root').innerHTML=`
<div class="scene" id="si">
  <div class="abs center" style="top:300px" id="it">
    <div style="font-weight:800;font-size:56px">Les</div>
    <div class="script" style="font-size:150px;line-height:.95">Tutos</div>
    <div style="font-family:Allura;font-size:120px;line-height:.9">de Karine</div>
  </div>
  <img id="ik" class="abs" src="a/karine2.png" style="width:640px;left:220px;top:1180px">
</div>
<div class="scene" id="sg">
  <div class="abs center" style="top:260px;padding:0 80px" id="gt">
    <div style="font-weight:900;font-size:70px;line-height:1.15">Je vais te guider pour</div>
    <div style="margin-top:50px;display:flex;flex-direction:column;gap:30px;align-items:center">
      ${['choisir une recette',"l'ajouter à ton panier",'et à tes repas'].map((x,i)=>`<div id="gl${i}" style="opacity:0"><span class="num">${i+1}</span><span class="script" style="font-size:96px;vertical-align:middle">${x}</span></div>`).join('')}
    </div>
  </div>
  <img id="gk" class="abs" src="a/karine2.png" style="width:560px;left:260px;top:1300px">
</div>
${CARD.map((c,k)=>`<div class="scene" id="cd${k}">
  <div class="abs center" style="top:300px" id="cdt${k}">
    <div class="pill" style="font-size:44px;padding:14px 44px">Étape ${k+1} / ${CARD.length}</div>
    <div style="font-weight:900;font-size:${c[0].length>18?84:96}px;line-height:1.05;margin-top:40px;padding:0 50px">${c[0]}</div>
    <div class="script" style="font-size:${Math.min(128,Math.round(1900/c[1].length))}px;line-height:1.1">${c[1]}</div>
  </div>
  <img id="cdi${k}" class="abs" src="${c[2]}" style="width:${c[3]}px;left:${(1080-c[3])/2}px;top:${c[2].endsWith('.jpg')?930:900}px;${c[2].endsWith('.jpg')?'border-radius:34px;border:10px solid #fff;box-shadow:0 30px 70px rgba(122,31,61,.28);':''}">
</div>`).join('')}
<div class="scene" id="sm">
  ${CH.map((c,i)=>`<div class="chap" id="c${i}" style="top:150px"><span class="num">${i+1}</span><span class="h2" style="font-size:52px;vertical-align:middle">${c}</span></div>`).join('')}
  <div class="phone" id="ph"><div class="screen"><div class="zoom" id="zm"><img id="vid" src="a/v/00001.jpg"><div class="tap" id="tap"></div></div><div class="pause" id="pz">⏸ pause</div></div></div>
  <div class="bub" id="bub"><div class="in"><img src="a/kav.png"><div class="tx" id="btx"></div></div><div class="ar" id="bar"></div></div>
</div>
<div class="scene" id="so">
  <div class="abs center" style="top:230px" id="ot">
    <div class="h2">Retrouve tous les tutos</div><div class="script" style="font-size:108px;line-height:1.05">dans l'appli</div>
    <div style="font-family:Allura;font-size:140px;line-height:.9;color:var(--rose);margin-top:36px">Karine</div>
    <div style="font-weight:900;font-size:56px;letter-spacing:10px;margin-top:-4px">DIÉTÉTIQUE</div>
    <div class="pill" style="font-size:56px;padding:28px 62px;margin-top:44px">karine-dietetique.fr</div>
    <div style="display:inline-flex;align-items:center;gap:18px;margin-top:38px;background:rgba(255,255,255,.92);border-radius:999px;padding:14px 36px 14px 16px;box-shadow:0 10px 30px rgba(122,31,61,.16)">
      <svg width="64" height="64" viewBox="0 0 72 72"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f9a13a"/><stop offset=".45" stop-color="#e5306b"/><stop offset="1" stop-color="#8a3ab9"/></linearGradient></defs><rect width="72" height="72" rx="20" fill="url(#ig)"/><rect x="15" y="15" width="42" height="42" rx="13" fill="none" stroke="#fff" stroke-width="5"/><circle cx="36" cy="36" r="10" fill="none" stroke="#fff" stroke-width="5"/><circle cx="48.5" cy="23.5" r="3.4" fill="#fff"/></svg>
      <span style="font-weight:900;font-size:42px">@karine_dieteticienne</span></div>
  </div>
  <img id="ok" class="abs" src="a/karine2.png" style="width:580px;left:250px;top:1320px">
</div>`;

let pending=Promise.resolve();
window.ready=()=>pending;
let curTxt=null;
function zoomState(g,u){
  let z=1,tx=0,ty=0;
  if(g.zoom){const i=G.indexOf(g);
    const same=x=>x&&x.zoom&&x.zoom.join()===g.zoom.join();
    const zin=same(G[i-1])?1:eio(lin(u,.05,ZIN)),zout=same(G[i+1])?0:eio(lin(u,g.dur-.4,g.dur));
    const k=zin*(1-zout),[x,y,f]=g.zoom,X=x*K,Y=y*K;z=1+(f-1)*k;
    tx=cl((SCR_W/2-X*z)*k+(X-X*z)*(1-k),SCR_W-SCR_W*z,0);ty=cl((SCR_H/2-Y*z)*k+(Y-Y*z)*(1-k),SCR_H-SCR_H*z,0);}
  return {z,tx,ty};
}
window.seek=function(t){
  $('bg').style.transform=`scale(${1.06+.03*Math.sin(t/3)}) translateX(${-18*Math.sin(t/5)}px)`;
  // intro + « Je vais te guider »
  $('si').style.opacity=1-lin(t,INTRO-.3,INTRO);
  pop($('it'),t,.1,.6);
  const ik=eo(lin(t,.3,1));$('ik').style.transform=`translateY(${(1-ik)*500}px)`;
  const ga=INTRO,gb=INTRO+GUIDE;
  const gv=Math.min(lin(t,ga,ga+.3),1-lin(t,gb-.3,gb));$('sg').style.opacity=gv;
  pop($('gt'),t,ga+.1,.5);[0,1,2].forEach(i=>pop($('gl'+i),t,ga+.9+i*.7,.45,30));
  const gk=eo(lin(t,ga+.2,ga+.9));$('gk').style.transform=`translateY(${(1-gk)*500}px)`;
  // segment courant
  let i=G.findIndex(g=>t>=g.a&&t<g.a+g.dur);if(i<0)i=t<G[0].a?0:G.length-1;
  const g=G[i],u=cl(t-g.a,0,g.dur);
  // écrans titres
  let cardVis=0;
  CARD.forEach((c,k)=>{const cg=G.find(x=>x.card===k),a=cg.a,b=a+cg.dur,v=Math.min(lin(t,a,a+.3),1-lin(t,b-.3,b));
    $('cd'+k).style.opacity=v;cardVis=Math.max(cardVis,v);
    pop($('cdt'+k),t,a+.05,.5,60);
    const ip=back(lin(t,a+.35,a+.95));$('cdi'+k).style.opacity=lin(t,a+.35,a+.5);$('cdi'+k).style.transform=`scale(${.5+.5*ip}) rotate(${(1-ip)*-8}deg) translateY(${Math.sin((t-a)*2.2)*8}px)`;});
  // scène téléphone : visible seulement hors écrans titres (plus de flash au début)
  const sceneOn=t>=G[0].a&&t<END?1:0;
  $('sm').style.opacity=sceneOn*(1-cardVis)*(1-lin(t,END-.3,END));
  // image de la vidéo
  const src=g.play?g.play[0]+u*g.v:g.hold;
  const fr=Math.min(2550,Math.max(1,Math.round(src*FPS)+1));
  const img=$('vid'),want=`a/v/${String(fr).padStart(5,'0')}.jpg`;
  if(!img.src.endsWith(want)){img.src=want;pending=img.decode().catch(()=>{});}
  // bandeau d'étape
  CH.forEach((c,k)=>{const segs=G.filter(x=>x.ch===k&&x.card===undefined),a=segs[0].a,b=segs[segs.length-1].a+segs[segs.length-1].dur,e=$('c'+k);
    const p=back(lin(t,a,a+.45));e.style.opacity=Math.min(lin(t,a,a+.15),1-lin(t,b-.15,b));e.style.transform=`scale(${.6+.4*p})`;});
  // zoom
  const {z,tx,ty}=g.card===undefined?zoomState(g,u):{z:1,tx:0,ty:0};
  $('zm').style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
  // pastille « pause » pendant les arrêts sur image avec texte
  $('pz').style.opacity=g.t&&!g.play?Math.min(lin(u,.3,.6),1-lin(u,g.dur-.3,g.dur))*.95:0;
  // tap
  const tp=$('tap');
  if(g.tap&&g.card===undefined){const [x,y]=g.tap;tp.style.left=x*K+'px';tp.style.top=y*K+'px';
    const on=lin(u,BUB_AT+.3,BUB_AT+.6),off=1-lin(u,g.dur-.35,g.dur);
    tp.style.opacity=on*off;tp.style.transform=`scale(${1+.14*Math.sin(Math.max(0,u-BUB_AT-.6)*6)})`;}
  else tp.style.opacity=0;
  // bulle de texte, posée sur l'image au plus près du bouton
  const bub=$('bub');
  if(g.t&&g.card===undefined){
    if(curTxt!==g.t){$('btx').innerHTML=g.t;curTxt=g.t;}
    const [x,y]=g.tap||g.at, zf=g.zoom?zoomState(g,g.dur/2):{z:1,tx:0,ty:0};
    const px=ORX+zf.tx+x*K*zf.z, py=ORY+zf.ty+y*K*zf.z;
    const W=720,H=bub.offsetHeight||200;
    let left=cl(px-W/2,30,1080-30-W),top,up=py>960;
    if(g.noptr){top=cl(py-H/2,300,1560-H);}
    else top=up?py-H-70:py+70;
    top=cl(top,250,1880-H);
    bub.className='bub '+(g.noptr?'':(up?'up':'down'));
    bub.style.left=left+'px';bub.style.top=top+'px';
    $('bar').style.display=g.noptr?'none':'block';$('bar').style.left=cl(px-left,60,W-60)+'px';
    const v=Math.min(lin(u,BUB_AT-.2,BUB_AT+.15),1-lin(u,g.dur-.3,g.dur));
    bub.style.opacity=v;bub.style.transform=`scale(${.85+.15*back(lin(u,BUB_AT-.2,BUB_AT+.25))})`;
  } else bub.style.opacity=0;
  // fin
  const v=t-END;
  $('so').style.opacity=lin(v,-.3,0);
  pop($('ot'),v,.05);
  const kp=eo(lin(v,.4,1.1));$('ok').style.opacity=lin(v,.4,.6);$('ok').style.transform=`translateY(${(1-kp)*400}px)`;
};
window.seek(0);
</script>
</body></html>
