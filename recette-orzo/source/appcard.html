<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Nunito;font-weight:800;src:url(a/nunito-latin-800-normal.woff2)}
@font-face{font-family:Nunito;font-weight:900;src:url(a/nunito-latin-900-normal.woff2)}
@font-face{font-family:Dancing;font-weight:700;src:url(a/dancing-script-700.woff2)}
@font-face{font-family:Allura;src:url(a/allura-latin-400-normal.woff2)}
:root{--rose:#e0527a;--bord:#7a1f3d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff6f4;font-family:Nunito,sans-serif;color:var(--bord)}
.bg{position:absolute;inset:-40px;background:url(a/fond.png) center/cover;opacity:.9}
.c{position:absolute;left:0;width:1080px;text-align:center}
.pill{display:inline-block;background:var(--rose);color:#fff;font-weight:900;border-radius:999px;box-shadow:0 14px 34px rgba(224,82,122,.35)}
.plate{position:absolute;left:90px;top:780px;width:900px;height:900px;border-radius:50%;overflow:hidden;border:14px solid #fff;box-shadow:0 30px 80px rgba(122,31,61,.35)}
.plate img{width:100%;height:100%;object-fit:cover}
.kcal{position:absolute;right:70px;top:760px;width:230px;height:230px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:72px;line-height:.95;box-shadow:0 14px 34px rgba(0,0,0,.25);transform:rotate(8deg)}
.kcal small{display:block;font-size:32px}
</style></head><body>
<div class="bg" id="bg"></div>
<div class="c" style="top:420px" id="t">
  <div style="font-weight:900;font-size:96px;line-height:1.08">Retrouve toutes<br>les recettes de Karine</div>
  <div style="font-family:Dancing;font-weight:700;color:var(--rose);font-size:140px;line-height:1.1;margin-top:20px">dans l'appli 📱</div>
</div>
<img id="k" src="a/karine2.png" style="position:absolute;width:640px;left:220px;top:1200px">
<script>
window.DURATION=2.2;
window.seek=t=>{const p=Math.min(1,t/.4),e=1-Math.pow(1-p,3);document.getElementById('t').style.opacity=p;document.getElementById('t').style.transform=`translateY(${(1-e)*40}px)`;document.getElementById('k').style.transform=`translateY(${(1-Math.min(1,t/.6))*300}px)`;document.getElementById('bg').style.transform='scale(1.06)';};
window.seek(0);
</script></body></html>
